<form [formGroup]="animationConfigForm" (ngSubmit)="submitNewConfig()" class="settings-form">
    <mat-form-field appearance="outline">
        <mat-label> Animation text </mat-label>
        <input matInput formControlName="animationText" />
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit">
        Submit
    </button>
</form>
